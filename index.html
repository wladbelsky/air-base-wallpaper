<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carrier Strike Group</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css?v=62">
</head>
<body>
<canvas id="c"></canvas>
<div id="splash"><div class="t">◆ CARRIER STRIKE GROUP</div><div class="s">ESTABLISHING DATALINK…</div><div class="bar"><i></i></div></div>
<div id="subs"><span class="who"></span><span class="txt"></span></div>
<div id="panel" class="pos-br">
  <div class="hdr">
    <span class="title">◆ CV-07 · FLIGHT DECK CONTROL</span>
    <span class="cnt">ACTIVE <b id="count">0/0</b></span>
    <button id="collapse" title="Collapse">–</button>
  </div>
  <div class="body">
    <div class="info">
      <div><span class="lbl">TIME</span><span id="clock">--:--</span></div>
      <div><span class="lbl">LIGHT</span><span id="daystate">—</span></div>
      <div><span class="lbl">STATUS</span><span id="audiostate">—</span></div>
      <div><span class="lbl">THREAT</span><span id="threat">—</span></div>
    </div>
    <div id="fleet"></div>
    <div id="meter"></div>
    <div id="list"></div>
    <div id="pager" hidden><button id="pgPrev">◀</button><span id="pgTypes"></span><span id="pgInfo">1/1</span><button id="pgNext">▶</button></div>
    <div class="btns">
      <button id="allUp">LAUNCH ALL</button>
      <button id="allDown">RECOVER ALL</button>
    </div>
    <label class="auto"><input type="checkbox" id="autoChk" checked> AUTO FLIGHT OPS</label>
  </div>
</div>
<script src="js/three.min.js"></script>
<script src="js/core.js?v=62"></script>
<script src="js/flightpath.js?v=62"></script>
<script src="js/models.js?v=62"></script>
<script src="js/airframes.js?v=62"></script>
<script src="js/effects.js?v=62"></script>
<script src="js/radio.js?v=62"></script>
<script src="js/aircraft.js?v=62"></script>
<script src="js/missions.js?v=62"></script>
<script src="js/persist.js?v=62"></script>
<script src="js/combat.js?v=62"></script>
<script src="js/airwar.js?v=62"></script>
<script src="js/tanker.js?v=62"></script>
<script src="js/main.js?v=62"></script>
<script src="js/properties.js?v=62"></script>
<script src="js/settings.js?v=62"></script>
<script>
  // Audio listener is registered at the end of <body>, as the Wallpaper Engine docs recommend
  if (window.wallpaperRegisterAudioListener) {
    window.wallpaperRegisterAudioListener(onAudio);
  } else {
    AUD.demo = true; if (new URLSearchParams(location.search).get('demo') === '1') DEMO.on = true;
    setInterval(demoAudio, 33); // preview in a regular browser
  }
</script>
</body>
</html>
